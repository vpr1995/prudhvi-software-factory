# CI for pull requests only (no push trigger). The diff is the PR head against its merge base with
# the target branch, for any target branch.
# - plan: repo-wide checks, then the list of Rush projects that the diff impacts.
# - project: one job for each impacted project (build, lint, typecheck, test, e2e).
# - knip: Knip on the whole repo (unused files, exports, types and dependencies).
# - ci-result: a required check. It passes only when plan, project, knip and workflow-lint pass.
# - workflow-lint: actionlint, zizmor and pinact on .github/workflows and .github/actions.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      projects: ${{ steps.impacted.outputs.projects }}
      count: ${{ steps.impacted.outputs.count }}
      base-sha: ${{ steps.diff.outputs.base-sha }}
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The real head of the PR, not the synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history and every branch: the merge base needs the target branch.
          fetch-depth: 0
          persist-credentials: false

      # No rush install here: rush check, rush list and the tsconfig check do not need it.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Show the diff that CI checks
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git rev-parse --verify --quiet "refs/remotes/origin/${BASE_REF}^{commit}" >/dev/null || {
            echo "::error::origin/${BASE_REF} is not a ref in this checkout"
            exit 1
          }
          base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          echo "BASE_SHA=${base}" >>"$GITHUB_ENV"
          echo "base-sha=${base}" >>"$GITHUB_OUTPUT"
          echo "base (merge base of origin/${BASE_REF} and HEAD): ${base}"
          echo "head: $(git rev-parse HEAD)"
          git diff --stat "${base}...HEAD"

      - name: Rush check
        run: node common/scripts/install-run-rush.js check

      - name: Check tsconfig files
        run: node tooling/tsconfig/scripts/check-tsconfigs.mjs

      - name: Rush audit (pnpm lockfile changed)
        run: |
          if git diff --name-only "${BASE_SHA}" HEAD -- common/config/rush/pnpm-lock.yaml | grep -q .; then
            node common/scripts/install-run-rush.js install
            node common/scripts/install-run-rush.js audit
          else
            echo "pnpm-lock.yaml not changed, audit skipped"
          fi

      # Output: a compact JSON list of { name, path, slug }. slug is the path with "-" for "/". It is
      # safe in cache keys and artifact names. An empty list gives count=0, and project skips.
      - name: List the projects that the diff impacts
        id: impacted
        run: |
          node common/scripts/install-run-rush.js list --impacted-by "git:${BASE_SHA}" --json >"${RUNNER_TEMP}/rush-list.json"
          node -e '
            const fs = require("node:fs");
            const text = fs.readFileSync(process.argv[1], "utf8");
            const list = JSON.parse(text.slice(text.indexOf("{"))).projects.map((project) => ({
              name: project.name,
              path: project.path,
              slug: project.path.replaceAll("/", "-"),
            }));
            console.log("Projects impacted by git:" + process.env.BASE_SHA + ": " + list.length);
            for (const project of list) console.log("  " + project.name + " (" + project.path + ")");
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              "projects=" + JSON.stringify(list) + "\ncount=" + list.length + "\n",
            );
          ' "${RUNNER_TEMP}/rush-list.json"

  project:
    name: ${{ matrix.project.name }}
    needs: plan
    # Skip with an empty list: fromJSON('[]') is not a valid matrix.
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.projects) }}
    env:
      PROJECT: ${{ matrix.project.name }}
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history: the coverage check on changed lines diffs against the merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: Repo setup
        id: setup
        uses: ./.github/actions/repo-setup
        with:
          build-cache-scope: ${{ matrix.project.slug }}

      # --to: the project and all its dependencies. Unchanged dependencies restore from the build cache.
      - name: Rush build
        id: build
        run: node common/scripts/install-run-rush.js build --to "${PROJECT}"

      # --only: this project only. The build step built the dependencies. Each check runs when the
      # build passed, also when an earlier check failed, so one run shows every failure.
      - name: Rush lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node common/scripts/install-run-rush.js lint --only "${PROJECT}"

      - name: Rush typecheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node common/scripts/install-run-rush.js typecheck --only "${PROJECT}"

      - name: Rush test
        id: test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node common/scripts/install-run-rush.js test --only "${PROJECT}"

      # Changed lines (merge base to PR head) that lcov lists: at least 80% (the lines threshold)
      # must run in tests. Only for a project with coverage/lcov.info. The build step built
      # tooling/vitest-config, which each project with Vitest depends on.
      - name: Coverage on changed lines
        if: ${{ !cancelled() && steps.test.outcome == 'success' && hashFiles(format('{0}/coverage/lcov.info', matrix.project.path)) != '' }}
        env:
          BASE_SHA: ${{ needs.plan.outputs.base-sha }}
          PROJECT_PATH: ${{ matrix.project.path }}
        run: node tooling/vitest-config/dist/diff-coverage.js "${BASE_SHA}" "${PROJECT_PATH}" <"${PROJECT_PATH}/coverage/lcov.info"

      # e2e needs a browser only when the project has Playwright. The Bruno CLI is a dev dependency
      # of the project, so rush install already installed it.
      - name: Restore the Playwright browsers
        id: cache-playwright
        if: ${{ !cancelled() && steps.build.outcome == 'success' && hashFiles(format('{0}/playwright.config.ts', matrix.project.path)) != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}

      - name: Install Chromium and its system packages
        if: ${{ !cancelled() && steps.cache-playwright.outcome == 'success' }}
        env:
          PROJECT_PATH: ${{ matrix.project.path }}
        run: '"${PROJECT_PATH}/node_modules/.bin/playwright" install --with-deps chromium'

      - name: Save the Playwright browsers
        if: ${{ !cancelled() && steps.cache-playwright.outcome == 'success' && steps.cache-playwright.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.cache-playwright.outputs.cache-primary-key }}

      - name: Rush e2e
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node common/scripts/install-run-rush.js e2e --only "${PROJECT}"

      # Entries older than 7 days are removed, so the saved cache does not grow without limit.
      - name: Prune the Rush build cache
        if: ${{ !cancelled() && steps.setup.outputs.build-cache-key != '' }}
        run: |
          mkdir -p common/temp/build-cache
          find common/temp/build-cache -type f -mtime +7 -delete
          du -sh common/temp/build-cache

      - name: Save the Rush build cache
        if: ${{ !cancelled() && steps.setup.outputs.build-cache-key != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: common/temp/build-cache
          key: ${{ steps.setup.outputs.build-cache-key }}

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-failure-logs-${{ matrix.project.slug }}
          path: |
            projects/*/rush-logs
            projects/*/test-results
            packages/*/rush-logs
            tooling/*/rush-logs
            platform/infra/rush-logs
          if-no-files-found: ignore
          retention-days: 7

  # Repo-wide: Knip reads every workspace, so it runs on each PR, not once per project.
  knip:
    name: knip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Repo setup
        uses: ./.github/actions/repo-setup
        with:
          build-cache-scope: knip

      # Knip loads each vitest.config.ts. They import the shared Vitest config from its dist/ folder.
      - name: Build the shared Vitest config
        run: node common/scripts/install-run-rush.js build --to @vprprudhvi/tooling-vitest-config

      # scripts/quality/knip.sh adds the github-actions reporter (annotations) when GITHUB_ACTIONS=true.
      - name: Rush knip
        run: node common/scripts/install-run-rush.js knip

  ci-result:
    name: ci-result
    needs: [plan, project, knip, workflow-lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the results of plan, project, knip and workflow-lint
        env:
          PLAN: ${{ needs.plan.result }}
          PROJECT: ${{ needs.project.result }}
          KNIP: ${{ needs.knip.result }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
        run: |
          echo "plan: ${PLAN}, project: ${PROJECT}, knip: ${KNIP}, workflow-lint: ${WORKFLOW_LINT}"
          if [ "${PLAN}" != "success" ]; then
            echo "::error::plan did not pass (${PLAN})"
            exit 1
          fi
          if [ "${KNIP}" != "success" ]; then
            echo "::error::knip did not pass (${KNIP})"
            exit 1
          fi
          if [ "${WORKFLOW_LINT}" != "success" ]; then
            echo "::error::workflow-lint did not pass (${WORKFLOW_LINT})"
            exit 1
          fi
          if [ "${PROJECT}" != "success" ] && [ "${PROJECT}" != "skipped" ]; then
            echo "::error::a project job did not pass (${PROJECT})"
            exit 1
          fi

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # The script skips when CI is set. An empty CI runs it. Pinned versions and sha256 checks.
      - name: Install the pinned tools
        env:
          CI: ''
          INSTALL_TOOLS_DIR: ${{ runner.temp }}/tools
        run: node scripts/security/install-tools.mjs

      # GITHUB_TOKEN lets pinact check that each version comment names the version of its SHA.
      - name: actionlint, zizmor, pinact
        env:
          INSTALL_TOOLS_DIR: ${{ runner.temp }}/tools
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/security/workflow-lint.sh
