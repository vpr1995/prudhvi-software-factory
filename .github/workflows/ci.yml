# CI for pull requests only (no push trigger). Install, build, lint and test the projects that the PR
# diff impacts, and run rush audit when the pnpm lockfile changed. The diff is the PR head against
# its merge base with the target branch, for any target branch.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The real head of the PR, not the synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history and every branch: the merge base needs the target branch.
          fetch-depth: 0
          persist-credentials: false

      - name: Show the diff that CI checks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git rev-parse --verify --quiet "refs/remotes/origin/${BASE_REF}^{commit}" >/dev/null || {
            echo "::error::origin/${BASE_REF} is not a ref in this checkout"
            exit 1
          }
          base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          echo "BASE_SHA=${base}" >>"$GITHUB_ENV"
          echo "base (merge base of origin/${BASE_REF} and HEAD): ${base}"
          echo "head: $(git rev-parse HEAD)"
          git diff --stat "${base}...HEAD"

      # Caches. Each key is exact: no restore-keys, so a changed lock rebuilds from scratch. Every
      # restore runs before the install, so hashFiles does not walk node_modules. Restore and save are
      # two steps (actions/cache/restore and actions/cache/save): the save step of the combined
      # actions/cache runs only when the job succeeds, so a failed run would cache nothing. Each save
      # step sits right after the step that fills its cache. The save steps use the key that the
      # restore step computed (cache-primary-key) and run only after a miss.
      - name: Cache the pnpm store
        id: cache-pnpm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: common/temp/pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}

      - name: Cache the Rush launcher
        id: cache-rush
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: common/temp/install-run
          key: ${{ runner.os }}-rush-install-run-${{ hashFiles('rush.json') }}

      # Toolchains. The built-in caches of the setup actions are off: actions/cache does the caching.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # 24.11.1, inside the range of rush.json
          package-manager-cache: false

      - name: Show the tool versions
        run: |
          node --version

      - name: Rush install
        run: node common/scripts/install-run-rush.js install

      # The install fills the pnpm store and the Rush launcher. Save them now, so that a later failure
      # does not lose them.
      - name: Save the pnpm store
        if: steps.cache-pnpm.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: common/temp/pnpm-store
          key: ${{ steps.cache-pnpm.outputs.cache-primary-key }}

      - name: Save the Rush launcher
        if: steps.cache-rush.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: common/temp/install-run
          key: ${{ steps.cache-rush.outputs.cache-primary-key }}

      - name: Rush check
        run: node common/scripts/install-run-rush.js check

      - name: Check tsconfig files
        run: node tooling/tsconfig/scripts/check-tsconfigs.mjs

      - name: List the projects that the diff impacts
        id: impacted
        run: |
          node common/scripts/install-run-rush.js list --impacted-by "git:${BASE_SHA}" --json >"${RUNNER_TEMP}/rush-list.json"
          node -e '
            const fs = require("node:fs");
            const text = fs.readFileSync(process.argv[1], "utf8");
            const list = JSON.parse(text.slice(text.indexOf("{"))).projects;
            fs.writeFileSync(process.argv[2], list.map((project) => project.path).join("\n") + "\n");
          ' "${RUNNER_TEMP}/rush-list.json" "${RUNNER_TEMP}/impacted-paths.txt"
          echo "Projects impacted by git:${BASE_SHA}:"
          cat "${RUNNER_TEMP}/impacted-paths.txt"
          echo "count=$(awk 'NF { n++ } END { print n + 0 }' "${RUNNER_TEMP}/impacted-paths.txt")" >>"$GITHUB_OUTPUT"

      # The Rush phases, one step each. With no impacted project the steps skip.
      # Build uses --from: the impacted projects, the projects that depend on them, and all the
      # dependencies of that set. The workspace packages (packages/*, tooling/*) have no dist/ on a
      # fresh runner, and the impacted projects import them, so they must build first.
      # --impacted-by would select only the changed projects and their dependents, and not build
      # their dependencies.
      - name: Rush build
        if: steps.impacted.outputs.count != '0'
        run: node common/scripts/install-run-rush.js build --from "git:${BASE_SHA}"

      # The other phases use --impacted-by: the diff scope only. They read the dist/ of the
      # dependencies that the build step wrote.

      - name: Rush lint
        if: steps.impacted.outputs.count != '0'
        run: node common/scripts/install-run-rush.js lint --impacted-by "git:${BASE_SHA}"

      - name: Rush test
        if: steps.impacted.outputs.count != '0'
        run: node common/scripts/install-run-rush.js test --impacted-by "git:${BASE_SHA}"

      - name: Rush audit (pnpm lockfile changed)
        run: |
          if git diff --name-only "${BASE_SHA}" HEAD -- common/config/rush/pnpm-lock.yaml | grep -q .; then
            node common/scripts/install-run-rush.js audit
          else
            echo "pnpm-lock.yaml not changed, audit skipped"
          fi

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-failure-logs
          path: |
            projects/*/rush-logs
            projects/*/test-results
            packages/*/rush-logs
            tooling/*/rush-logs
            platform/infra/rush-logs
          if-no-files-found: ignore
          retention-days: 7
