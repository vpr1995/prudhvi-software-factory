# Secret scan for pull requests: gitleaks over the PR commits (merge base..head), with the repo
# config .gitleaks.toml. The gitleaks binary is the pinned one from scripts/security/install-tools.mjs.
# A finding fails the job.
name: secrets

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history: the scan range starts at the merge base with the target branch.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # The script skips when CI is set. An empty CI runs it. Pinned versions and sha256 checks.
      - name: Install the pinned tools
        env:
          CI: ''
          INSTALL_TOOLS_DIR: ${{ runner.temp }}/tools
        run: node scripts/security/install-tools.mjs

      - name: Scan the PR commits
        env:
          BASE_REF: ${{ github.base_ref }}
          GITLEAKS: ${{ runner.temp }}/tools/gitleaks
        run: |
          base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          echo "range: ${base}..$(git rev-parse HEAD)"
          "${GITLEAKS}" git --log-opts="${base}..HEAD" --config .gitleaks.toml --redact --no-banner --verbose
