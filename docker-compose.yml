# Local tracing. Start it with: docker compose up -d
# Set OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 for the web and api processes.
# Open the Jaeger UI at http://localhost:16686 and search by service name or by trace id.
services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    # Bind to loopback only: the collector has no auth, so it must not listen on the LAN.
    ports:
      - '127.0.0.1:16686:16686' # Jaeger UI
      - '127.0.0.1:4318:4318' # OTLP over HTTP
      - '127.0.0.1:4317:4317' # OTLP over gRPC
