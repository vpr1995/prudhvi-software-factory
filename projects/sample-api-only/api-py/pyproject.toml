[project]
name = "sample-api-only-api-py"
version = "0.0.0"
description = "Python API of sample-api-only. Runs on Lambda (sample_api.handler) or locally (python -m sample_api)."
requires-python = ">=3.12"
dependencies = [
    "aws-lambda-powertools>=3.37.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sample_api"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "datamodel-code-generator>=0.86.0",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.5.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["src/sample_api/generated"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "S", "BLE", "C4", "SIM", "PT", "RET", "ARG",
    "PL", "RUF", "ANN", "D", "C90", "T20",
]
ignore = [
    "D203", # conflicts with D211
    "D213", # conflicts with D212
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 3

[tool.ruff.lint.pep8-naming]
# BaseHTTPRequestHandler dispatches on these method names.
ignore-names = ["do_GET", "do_POST"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "PLR2004", "ARG"]
"scripts/**" = ["T201"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# `APIGatewayHttpResolver.exception_handler` has no type hints in Powertools.
module = "sample_api.app"
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=sample_api",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage/coverage.xml",
    "--cov-fail-under=80",
]

[tool.coverage.run]
omit = ["*/generated/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 80

[tool.bandit]
exclude_dirs = ["tests"]
